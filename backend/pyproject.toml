[project]
name = "apaar-integrity-backend"
version = "0.1.0"
description = "FastAPI backend for the APAAR Integrity Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "engine",
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pynacl>=1.6.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: integration tests against Postgres; run with RUN_DB_TESTS=1"]
