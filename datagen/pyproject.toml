[project]
name = "apaar-integrity-datagen"
version = "0.1.0"
description = "Synthetic admissions data with planted anomalies for the APAAR Integrity Platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
